#
# Target half of the suit's read-only configuration (scratch/suit/ro.cfg and
# raw.cfg, after their "adapter driver" / "adapter serial" / "transport"
# lines): the AHB-AP as a plain memory AP, so nothing can halt, reset or
# step the core.  Combine with an adapter config, e.g.
#   openocd -f scripts/sim/qemu-swd.cfg -f tests/debug-port/ro-mem-ap.cfg
adapter speed 1000
reset_config none
swd newdap suit cpu -enable
dap create suit.dap -chain-position suit.cpu
target create suit.mem mem_ap -dap suit.dap -ap-num 0
