# Exercise the single BURTC COMP owner: the Counter alarm must fire while the
# same peripheral is Zephyr's tickless system clock.
CONFIG_CONSOLE=y
CONFIG_PRINTK=y
CONFIG_COUNTER=y
CONFIG_GECKO_BURTC_TIMER=y
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_COUNTER_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_CLOCK_EVENT=y
CONFIG_DEFERRED_RELEASE=y
CONFIG_SCHED_DEADLINE=y
CONFIG_MAIN_STACK_SIZE=1024
