# Transmit power control under QEMU (docs/tx-power.md). Zephyr's split controller on the EFR32
# lower link layer; settings as tests/amateur-port's QEMU profile.
CONFIG_BT=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="efr32-tx-power"
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
# The checks print with printk; no log output between them.
CONFIG_LOG=n
CONFIG_NUM_METAIRQ_PRIORITIES=2
CONFIG_EFR32_RADIO_TIMING_QEMU=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ZLI=n
CONFIG_ISR_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1536

# The feature under test: a +4 dBm default, per-role levels over the vendor HCI commands, and
# the amateur station's ceiling.
CONFIG_BT_CTLR_TX_PWR_PLUS_4=y
CONFIG_BT_CTLR_TX_PWR_DYNAMIC_CONTROL=y
CONFIG_EFR32_RADIO_AMATEUR=y
