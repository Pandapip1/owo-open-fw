CONFIG_ZTEST=y
# The QEMU model has no RTCC sleeptimer: the system clock runs on BURTC.
CONFIG_GECKO_BURTC_TIMER=y
CONFIG_SILABS_SLEEPTIMER_TIMER=n
# BURTC's driver is a Counter one. TIMER0 has no driver (its node stays disabled): it belongs
# to the test.
CONFIG_COUNTER=y
CONFIG_COUNTER_GECKO_STIMER=n
