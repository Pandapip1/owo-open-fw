# Synthesizer frequency-switch probe (docs/radio-tables.md 7.90), silicon profile: a passive
# scanner (receives only) on Zephyr's split controller over the EFR32 lower link layer.
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="efr32-fswitch-probe"
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_LOG=y
CONFIG_LOG_PRINTK=n
CONFIG_NUM_METAIRQ_PRIORITIES=2
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ZLI=n
CONFIG_ISR_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=1024
CONFIG_MAIN_STACK_SIZE=2048
# Silicon: the QEMU-only receive and TIFS seams off, silicon budgets and paths.
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
CONFIG_EFR32_RADIO_TIMING_QEMU=n
CONFIG_EFR32_RADIO_TIMING_SILICON=y
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=960
CONFIG_EFR32_RADIO_LLL_STACK_SIZE=960
CONFIG_SCHED_DEADLINE_MISS_HISTORY=4
CONFIG_EFR32_RADIO_BRINGUP_TRACE=n
