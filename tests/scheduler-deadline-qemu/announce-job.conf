# With sched-clock.conf: kernel timeouts expire in the announcing job, not in the clock-event
# interrupt (CONFIG_CLOCK_EVENT_SYSTEM_TIMER_JOB). The job is a meta-IRQ, so timeouts preempt
# cooperative threads as they did from the interrupt; at the third level, below the two the
# deadline suites use.
CONFIG_SCHED_DEADLINE=y
CONFIG_CLOCK_EVENT_SYSTEM_TIMER_JOB=y
CONFIG_TIMESLICING=n
CONFIG_NUM_METAIRQ_PRIORITIES=3
CONFIG_CLOCK_EVENT_SYSTEM_TIMER_JOB_PRIORITY=-14
CONFIG_CLOCK_EVENT_SYSTEM_TIMER_JOB_DEADLINE_NS=100000
CONFIG_CLOCK_EVENT_SYSTEM_TIMER_JOB_MIN_INTERARRIVAL_NS=100000
# The suites report misses to their own handlers.
CONFIG_SCHED_DEADLINE_MISS_PANIC=n
