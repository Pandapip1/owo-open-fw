# vendor/zephyr/tests/kernel/sched/deadline_budget on the EFR32BG22 QEMU model: the run budget
# timer goes through the scheduler clock service (TIMER0 while the CPU runs). As sched-clock.conf,
# but the suite's own miss handler counts the reports (no panic policy).
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
# The delivery bound of a scheduler clock event on this model, as the product derives it
# (modules/efr32-radio/Kconfig, CLOCK_EVENT_SCHED_LATE_TOLERANCE_NS): one BURTC cycle (COMP one
# count before the deadline's tick) plus one interrupt the delivering interrupt may wait behind,
# 72.4 us in QEMU. The kernel's generic 61036 (two BURTC cycles) leaves out the interrupt, and
# this image's deliveries reach 88-90 us with or without budget enforcement.
CONFIG_CLOCK_EVENT_SCHED_LATE_TOLERANCE_NS=102918
