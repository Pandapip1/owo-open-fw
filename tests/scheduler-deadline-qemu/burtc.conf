# The board default uses the RTCC-based SiLabs sleeptimer, which the QEMU
# machine does not yet model.  The tested BURTC path is modeled and shares
# its one COMP/IRQ18 route between the Counter API and system clock.
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_GECKO_BURTC_TIMER=y
CONFIG_COUNTER=y

# Avoid compiling the unused RTCC Counter implementation in this dedicated
# BURTC system-clock profile.
CONFIG_COUNTER_GECKO_STIMER=n
