# With sched-clock.conf: timed kernel calls attributed to the running job
# (CONFIG_SCHED_DEADLINE_JOBS) and timed jobs on scheduler clock events.
CONFIG_SCHED_DEADLINE=y
CONFIG_SCHED_DEADLINE_ADMISSION=y
CONFIG_SCHED_DEADLINE_JOBS=y
CONFIG_TIMESLICING=n
CONFIG_CLOCK_EVENT_SCHED_CLIENTS=6
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
