# The kernel scheduler clock: BURTC carries time across deep sleep and the
# HFXO-clocked TIMER0 provides it while the CPU runs. The system timer and
# every kernel timeout go through the scheduler clock service.
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
# A missed deadline (a clock event delivered after its deadline plus tolerance) is a fault.
CONFIG_SCHED_DEADLINE_MISS_PANIC=y
