# Add the radio sequencer Cortex-M0+ on AP3 to OpenOCD's Series-2 target.
# The upstream xG21/xG22 configuration currently declares only the M33 on AP0
# and the Debug Challenge Interface on AP1.
source [find target/silabs/xg21.cfg]

target create efm32.seq cortex_m -dap efm32.dap -ap-num 3
efm32.seq configure -work-area-size 0
