# Opt-in test profile, merged with prj.conf using EXTRA_CONF_FILE: an active scanner on the
# silicon path. No QEMU-only seam: the sequencer sends the SCAN_REQ at T_IFS after the received
# advertisement and turns to receive the SCAN_RSP (the staged scanner, docs/radio-tables.md
# 7.87).
CONFIG_RADIO_RX_PORT_ACTIVE_SCAN=y
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
