# Opt-in test profile, merged with prj.conf using EXTRA_CONF_FILE. It replaces the scanner-only
# workload with a central that connects to the radio-port advertiser (src/central.c). It runs the
# hardware configuration, the silicon path: the initiator's CONNECT_IND is the sequencer's RX->TX
# response at T_IFS and its anchors are TX launches held to the sleep clock's 16 us
# (docs/radio-tables.md 7.79). The QEMU-configuration seams' T_IFS starts at the LLL callback, so
# their CONNECT_IND reaches the advertiser after its window. Do not select it for a hardware
# build.
CONFIG_BT_OBSERVER=n
CONFIG_BT_CENTRAL=y
CONFIG_RADIO_RX_PORT_CENTRAL=y
# The Central writes and reads back the advertiser's test characteristic over the link.
CONFIG_BT_GATT_CLIENT=y
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
# The workload is C: main needs less than the Rust default.
CONFIG_MAIN_STACK_SIZE=1536
# Same connection-path budget as the advertiser's prj-connection.conf. QEMU-test headroom only;
# the hardware profile keeps the measured values. The log buffer shrinks to fund the stacks.
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
CONFIG_LOG_BUFFER_SIZE=256
# As in prj-connection.conf: the QEMU M33 runs lll_conn's turnaround callbacks past their
# spec-derived start-by deadlines (7.79), so this QEMU-only profile counts missed deadlines
# instead of shutting the radio down.
CONFIG_SCHED_DEADLINE_MISS_COUNT=y
