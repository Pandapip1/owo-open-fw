# Opt-in test profile, merged with prj.conf using EXTRA_CONF_FILE. It replaces
# the scanner-only workload with a central that connects to the radio-port
# advertiser. Connection establishment reuses the QEMU-only RX-to-TX
# turn-around: the central receives ADV_IND then stages CONNECT_IND on the
# same primary channel, and the peripheral answers the first connection
# event. Do not select it for a hardware build.
CONFIG_BT_OBSERVER=n
CONFIG_BT_CENTRAL=y
CONFIG_RADIO_RX_PORT_CENTRAL=y
CONFIG_EFR32_RADIO_QEMU_TIFS=y
# Same connection-path budget as the advertiser's prj-connection.conf: the
# RX completion of ADV_IND runs ll_create_conn plus first-event scheduling,
# the CONNECT_IND and connection-event launches run the legacy
# radio_tx_enable()/radio_rx_enable() arm contract, and the LL thread runs
# connection-event LLL code. QEMU-test headroom only; the hardware profile
# keeps the measured values. The log buffer shrinks to fund the stacks.
CONFIG_EFR32_RADIO_LL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
CONFIG_LOG_BUFFER_SIZE=256
# The CONNECT_IND transmit window is 1.25 ms after the ADV_IND the model
# delivers, and the host->controller->launch path takes ~16 ms of virtual time
# at icount shift=3. QEMU instruction pacing cannot meet a silicon window, so
# this profile counts late job deadlines without panicking. The advertising
# profiles keep PANIC_ON_LATE; this is a model-timing bound, not a silicon
# deadline claim.
CONFIG_CLOCK_EVENT_SCHED_PANIC_ON_LATE=n
