# Hardware scanner on the BGM220 Explorer Kit (board bgm220_ek4314a/bgm220pc22hna), merged with
# prj.conf using EXTRA_CONF_FILE. The QEMU receive and TIFS seams do not describe silicon; the
# receiver opens from OFF (SWRXEN -> RXWARM -> RXSEARCH, docs/radio-tables.md 7.80).
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
# Budgets, paths and the interrupt allowance behind every deadline: the silicon measurements.
CONFIG_EFR32_RADIO_TIMING_QEMU=n
CONFIG_EFR32_RADIO_TIMING_SILICON=y
# The measured LL stack budget of tests/radio-port/prj-hardware.conf.
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=960
CONFIG_EFR32_RADIO_LLL_STACK_SIZE=960
CONFIG_SCHED_DEADLINE_MISS_HISTORY=4
CONFIG_EFR32_RADIO_BRINGUP_TRACE=n
