# Scanner-only QEMU smoke using Zephyr's split controller and our EFR32 LLL.
CONFIG_RUST=y
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="efr32-radio-rx-port"
# The smoke must execute the actual EFR32 HAL MMIO path, rather than the
# compile-only stub configuration.
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
# This scanner image is run only under the in-tree EFR32 QEMU model. The
# option consumes QEMU's synthetic BUFC channel-2 class-6/7 records; leave it
# disabled in every hardware configuration because the silicon producer and
# RXDONE ordering remain unproven.
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_COUNTER=y
CONFIG_GECKO_BURTC_TIMER=y
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_LOG=y
