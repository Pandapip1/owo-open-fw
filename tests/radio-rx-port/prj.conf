# Scanner-only QEMU smoke using Zephyr's split controller and our EFR32 LLL.
CONFIG_RUST=y
CONFIG_BT=y
CONFIG_BT_OBSERVER=y
CONFIG_BT_DEVICE_NAME="efr32-radio-rx-port"
# The smoke must execute the actual EFR32 HAL MMIO path, rather than the
# compile-only stub configuration.
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
# This scanner image is run only under the in-tree EFR32 QEMU model. The
# option consumes QEMU's synthetic BUFC channel-2 class-6/7 records; leave it
# disabled in every hardware configuration because the silicon producer and
# RXDONE ordering remain unproven.
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=y
CONFIG_ENTROPY_GENERATOR=y
# System time and every kernel or radio wake-up come from the scheduler clock: BURTC
# across deep sleep, TIMER0 (HFXO) while the CPU runs.
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_LOG=y
# A clock event delivered after its deadline (plus tolerance) is a fault in test builds.
CONFIG_CLOCK_EVENT_SCHED_PANIC_ON_LATE=y
# The lower link layer runs in meta-IRQ threads, not interrupts (modules/efr32-radio/hal/ll_threads.c).
CONFIG_NUM_METAIRQ_PRIORITIES=1
# BT_CTLR_ZLI is only settable with the controller's advanced options visible.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ZLI=n
# Interrupts only publish work now. One analyzer run peaked at 368 bytes, but
# nested interrupts with FP context overflowed 768.
CONFIG_ISR_STACK_SIZE=1024
