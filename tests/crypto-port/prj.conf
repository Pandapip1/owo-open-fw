# RADIOAES driver tests (src/main.c). Results are printed and kept in crypto_results (read over
# SWD on silicon: scripts in docs/crypto.md).
CONFIG_PRINTK=y
CONFIG_CONSOLE=y
CONFIG_EFR32_RADIOAES=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_PSA_CRYPTO=y
CONFIG_PSA_WANT_KEY_TYPE_AES=y
CONFIG_PSA_WANT_ALG_ECB_NO_PADDING=y
CONFIG_PSA_WANT_ALG_CMAC=y
CONFIG_PSA_WANT_ALG_CCM=y
# The host's P-256 set (subsys/bluetooth/host/Kconfig BT_ECC), timed in software for comparison.
CONFIG_PSA_WANT_ALG_ECDH=y
CONFIG_PSA_WANT_ECC_SECP_R1_256=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_IMPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_EXPORT=y
CONFIG_PSA_WANT_KEY_TYPE_ECC_KEY_PAIR_GENERATE=y
CONFIG_MBEDTLS_PSA_P256M_DRIVER_ENABLED=y
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=4
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_INIT_STACKS=y
CONFIG_THREAD_STACK_INFO=y
CONFIG_TIMING_FUNCTIONS=y
CONFIG_EFR32_RADIOAES_PROBE=y
