# Amateur-radio workload for QEMU (docs/amateur-radio.md). Zephyr's split controller on the
# EFR32 lower link layer; settings as tests/radio-port's QEMU profile, without Rust.
CONFIG_BT=y
CONFIG_BT_DEVICE_NAME="efr32-amateur-port"
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_LOG=y
CONFIG_NUM_METAIRQ_PRIORITIES=2
CONFIG_EFR32_RADIO_TIMING_QEMU=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ZLI=n
CONFIG_ISR_STACK_SIZE=1024
CONFIG_LOG_BUFFER_SIZE=1024
# The checks print with printk directly, not through the log buffer.
CONFIG_LOG_PRINTK=n
CONFIG_MAIN_STACK_SIZE=1536

# The feature under test.
CONFIG_EFR32_RADIO_AMATEUR=y
