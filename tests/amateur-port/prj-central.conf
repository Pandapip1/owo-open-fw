# Central role (with prj.conf): connects to AMATEUR_PORT_PEER_NAME (prj-peripheral.conf), then
# scans passively while connected, so it receives the Peripheral's identifications between
# connection events. Hardware configuration, as tests/radio-rx-port/prj-central.conf: the
# initiator's CONNECT_IND is the sequencer's RX->TX response at T_IFS (docs/radio-tables.md
# 7.79).
CONFIG_BT_CENTRAL=y
CONFIG_BT_OBSERVER=y
CONFIG_AMATEUR_PORT_CENTRAL=y
CONFIG_AMATEUR_PORT_SELFTEST=n
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
CONFIG_LOG_BUFFER_SIZE=256
# As prj-peripheral.conf: scheduler misses counted, broken amateur rules still stop. QEMU only.
CONFIG_EFR32_RADIO_TEST_QEMU_COUNT_LL_MISSES=y
