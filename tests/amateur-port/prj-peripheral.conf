# Connectable advertiser role (with prj.conf): stays in the connection a Central makes
# (prj-central.conf). Like tests/radio-port/prj-connection.conf it runs the hardware
# configuration, the silicon path: both QEMU-only seams off, so the sequencer turns around at
# T_IFS and received frames are dated from RAC.STIMER, which a connection needs; the QEMU
# seams' T_IFS starts at the LLL callback, so a connection on them is not spec-timed
# (docs/radio-tables.md 7.79).
CONFIG_BT_PERIPHERAL=y
CONFIG_AMATEUR_PORT_PERIPHERAL=y
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
# Connection-path stacks, as tests/radio-port/prj-connection.conf (QEMU-test headroom).
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
CONFIG_LOG_BUFFER_SIZE=256
# The QEMU M33 runs lll_conn's turnaround callbacks past their spec-derived start-by deadlines
# (7.79), which the QEMU connection profiles count (SCHED_DEADLINE_MISS_COUNT). Amateur
# operation needs the safe-shutdown policy for its own rules, so this counts scheduler misses
# and still stops the radio on a broken amateur rule. QEMU only.
CONFIG_EFR32_RADIO_TEST_QEMU_COUNT_LL_MISSES=y
