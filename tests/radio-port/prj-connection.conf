# Connection-role advertiser profile for the QEMU connection e2e. A connection
# event runs paths the advertising workload never touched: the RX/TX launch
# jobs call the legacy radio_tx_enable()/radio_rx_enable() arm contract, the
# completion job runs the LLL callback that creates the connection
# (ll_create_conn plus first-event scheduling), and the LL thread runs
# connection-event LLL code (lll_conn/lll_pdu) instead of the advertising
# mayflies. These budgets are a QEMU-test headroom allowance only; the
# hardware profile keeps the measured values. The log buffer shrinks to fund
# them, as the advertiser's console already runs 256 bytes in overflow mode.
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
CONFIG_LOG_BUFFER_SIZE=256
# See tests/radio-rx-port/prj-central.conf: the connection-event launch
# deadlines are unreachable at QEMU instruction pacing, so missed deadlines are
# counted without a safe shutdown in this profile only.
CONFIG_SCHED_DEADLINE_MISS_COUNT=y
