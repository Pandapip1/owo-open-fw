# Connection-role advertiser (Peripheral) profile for the QEMU connection e2e, merged with
# prj.conf using EXTRA_CONF_FILE. It runs the hardware configuration, the silicon path: both
# QEMU-only seams off, so the sequencer turns around at T_IFS and the HAL dates received frames
# from RAC.STIMER, which the Peripheral's anchor tracking needs (docs/radio-tables.md 7.79). The
# QEMU-configuration seams have no air time and their T_IFS starts at the LLL callback, so a
# connection on them cannot be spec-timed.
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n
# The Central writes and reads back a test characteristic over the link (src/gatt.c).
CONFIG_RADIO_PORT_GATT_TEST=y
# A connection event runs paths advertising does not: lll_conn's callbacks in the completion job
# and its prepares in the LL threads. QEMU-test headroom only; the hardware profile keeps the
# measured values. The log buffer shrinks to fund them.
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
CONFIG_LOG_BUFFER_SIZE=256
# In QEMU the M33 runs lll_conn_isr_rx's path to RESPOND in 133 us, past the ~107 us the
# sequencer's T_IFS hold leaves after a frame's end, and lll_conn_isr_tx's path to PENDING in
# 99 us against ~5 us of slack after one 72 us interrupt (docs/radio-tables.md 7.79): every
# connection-event turnaround misses its spec-derived start-by in the model. This QEMU-only
# profile therefore counts missed deadlines instead of shutting the radio down; the advertising
# profiles and every hardware image keep the safe-shutdown policy.
CONFIG_SCHED_DEADLINE_MISS_COUNT=y
