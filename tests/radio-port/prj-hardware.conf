# The synthetic QEMU receive and TIFS seams do not describe silicon.
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n

# Timing observations are evidence during first silicon bring-up, not grounds
# for turning a late event into an immediate kernel panic.
CONFIG_CLOCK_EVENT_SCHED_PANIC_ON_LATE=n

# Preserve the complete first-fault report on the small-RAM hardware smoke.
CONFIG_LOG_MODE_IMMEDIATE=y

# One-shot checkpoints distinguish HCI command acceptance from execution of
# the custom PHY/framing/FIFO/scheduler/TX path on real silicon.
CONFIG_EFR32_RADIO_BRINGUP_TRACE=y
# A live advertising command drove the ULL PSP to the exact bottom of its
# former 800-byte stack before a 36-byte division-helper frame faulted. Keep
# additional room for the immediate trace formatter and exception entry.
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=1024
CONFIG_EFR32_RADIO_LLL_STACK_SIZE=384
# Immediate trace formatting runs on the persistent launch jobs during this
# diagnostic build; leave room for printk's call chain on Cortex-M33.
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=768

# Zephyr's Bluetooth host initializes PSA CMAC even for this minimal legacy
# advertiser. The common-libc default of zero makes that allocation fail.
# 3504 preserves room for the measured scheduler-visible LL stacks; it is a
# provisional bring-up budget, not a derived production constant. Revisit it
# with allocator high-water instrumentation before freezing the configuration.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=3504
