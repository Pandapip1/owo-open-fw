# The synthetic QEMU receive and TIFS seams do not describe silicon.
CONFIG_EFR32_RADIO_QEMU_TIFS=n
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=n

# Preserve the complete first-fault report on the small-RAM hardware smoke.
CONFIG_LOG_MODE_IMMEDIATE=y

# The one-shot bring-up checkpoints print synchronously (immediate logging)
# from the lower link layer's release paths, ticker compare and doorbell
# interrupts included: the first ticker run then starts 4.4 ms after its
# compare, a missed deadline that shuts the radio down. Stage 3 is on air.
CONFIG_EFR32_RADIO_BRINGUP_TRACE=n
# Immediate formatting of fault reports runs on the LL contexts. With the LLL
# prepares in the LLL context (CONFIG_BT_CTLR_LLL_PRIO above CONFIG_BT_CTLR_ULL_HIGH_PRIO),
# stage 3 on silicon peaked at 820 bytes in the LLL context and 796 in the ULL
# worker (CONFIG_INIT_STACKS high-water marks, 40 s with a host active scan);
# 960 each covers those plus FP exception entry (104 bytes; 136 in the worker).
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=960
CONFIG_EFR32_RADIO_LLL_STACK_SIZE=960
# Missed-deadline reports list the last four job starts (RAM).
CONFIG_SCHED_DEADLINE_MISS_HISTORY=4
# Budgets, paths and the interrupt allowance behind every deadline: the silicon measurements.
CONFIG_EFR32_RADIO_TIMING_SILICON=y

# Zephyr's Bluetooth host initializes PSA CMAC even for this minimal legacy
# advertiser. The common-libc default of zero makes that allocation fail.
# 3504 preserves room for the measured scheduler-visible LL stacks; it is a
# provisional bring-up budget, not a derived production constant. Revisit it
# with allocator high-water instrumentation before freezing the configuration.
CONFIG_COMMON_LIBC_MALLOC_ARENA_SIZE=3504
