# Zephyr's own link layer, our lower layer. The Silicon Labs controller (BT_SILABS_EFR32) is off.
CONFIG_RUST=y
CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="efr32-radio-port"
# The QEMU smoke must execute the real EFR32 HAL MMIO path.  The stub option
# remains useful for compile-only contract checks, but would make this smoke
# unable to say whether an accepted advertiser reached the radio model.
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
CONFIG_EFR32_RADIO_QEMU_TIFS=y
# The active-scan integration workload makes this advertiser receive a
# QEMU-medium SCAN_REQ before it can stage its SCAN_RSP. This simulator-only
# descriptor consumer normalizes that receive completion; it must remain off
# for hardware images because silicon descriptor/RXDONE ordering is unproven.
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_COUNTER=y
CONFIG_GECKO_BURTC_TIMER=y
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_LOG=y
