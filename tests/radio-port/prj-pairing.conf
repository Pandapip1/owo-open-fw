# Pairing profile, merged after prj-connection.conf: the product's security (prj.conf at the
# repository root): LE Secure Connections only, MITM enforced, passkey from the application. The
# test characteristic then needs an authenticated encrypted link (src/gatt.c), so every GATT round
# of the Central runs over link-layer AES-CCM (RADIOAES, modules/efr32-radio/crypto).
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_RADIO_PORT_PAIRING_TEST=y
# As the product (prj.conf): no controller privacy or filter accept list (BT_SMP otherwise
# defaults BT_CTLR_PRIVACY on) and no GATT caching. With controller privacy the sequencer
# cannot stage the scan response (lll/lll_adv_stage.c needs no resolving list), so the M33
# decides each SCAN_REQ at its end; on silicon admission found that turnaround unsat at the
# laptop's first SCAN_REQ (55.6 us window, 58.1 us interrupt allowance) and shut the radio
# down (docs/radio-tables.md 7.84). GATT caching's database hash needs multi-part PSA CMAC,
# which crypto/radioaes_psa.c does not offer ("CMAC operation init failed -134").
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_FILTER_ACCEPT_LIST=n
CONFIG_BT_GATT_CACHING=n
