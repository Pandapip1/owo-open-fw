# Pairing profile, merged after prj-connection.conf: the product's security (prj.conf at the
# repository root): LE Secure Connections only, MITM enforced, passkey from the application. The
# test characteristic then needs an authenticated encrypted link (src/gatt.c), so every GATT round
# of the Central runs over link-layer AES-CCM (RADIOAES, modules/efr32-radio/crypto).
CONFIG_BT_SMP=y
CONFIG_BT_SMP_SC_PAIR_ONLY=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_RADIO_PORT_PAIRING_TEST=y
