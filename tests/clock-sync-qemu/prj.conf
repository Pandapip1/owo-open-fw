# The scheduler clock's self-checks on the EFR32BG22 model, against injected clock faults
# (run-clock-sync-qemu.sh). Providers as the product: BURTC across EM2, TIMER0 in EM0/EM1.
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_SYS_CLOCK_TICKS_PER_SEC=32768
CONFIG_TICKLESS_KERNEL=y
CONFIG_PM=y
CONFIG_CLOCK_EVENT_SCHED_SYNC_CHECK=y
CONFIG_PRINTK=y
