# samples/bluetooth/hci_uart, with Zephyr's own link layer as the controller.
CONFIG_SERIAL=y
CONFIG_UART_INTERRUPT_DRIVEN=y
CONFIG_GPIO=y
CONFIG_BT=y
CONFIG_BT_HCI_RAW=y
# Every role the host may ask for: scanning, initiating, advertising and
# accepting a connection.  One link: the part has 32 KiB of RAM.
CONFIG_BT_OBSERVER=y
CONFIG_BT_BROADCASTER=y
CONFIG_BT_CENTRAL=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_MAX_CONN=1
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=512

# The lower link layer, as tests/radio-port/prj.conf configures it for QEMU.
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
CONFIG_EFR32_RADIO_QEMU_TIFS=y
# Simulator-only receive-descriptor consumer; off for hardware images.
CONFIG_EFR32_RADIO_QEMU_RX_DESCRIPTOR=y
CONFIG_ENTROPY_GENERATOR=y
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_NUM_METAIRQ_PRIORITIES=2
CONFIG_EFR32_RADIO_TIMING_QEMU=y
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ZLI=n
CONFIG_ISR_STACK_SIZE=1024
CONFIG_MAIN_STACK_SIZE=1536
# Connection events run the RX/TX launch and completion jobs with the
# connection LLL (tests/radio-port/prj-connection.conf's QEMU headroom).
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=896
CONFIG_EFR32_RADIO_LAUNCH_STACK_SIZE=640
CONFIG_EFR32_RADIO_COMPLETION_STACK_SIZE=960
# As tests/radio-rx-port/prj-central.conf: connection-event launch deadlines
# are unreachable at QEMU instruction pacing, so misses are counted without a
# safe shutdown in this QEMU profile only.
CONFIG_SCHED_DEADLINE_MISS_COUNT=y

# Diagnostics on the USART0 console.
CONFIG_CONSOLE=y
CONFIG_UART_CONSOLE=y
CONFIG_LOG=y
CONFIG_LOG_BUFFER_SIZE=256
# lll_conn_force_md_cnt_set() is the Nordic LLL's; the EFR32 LLL has no forced-MD hook.
CONFIG_BT_CTLR_FORCE_MD_AUTO=n
