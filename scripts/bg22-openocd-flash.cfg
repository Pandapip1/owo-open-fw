# Halt through the architected DHCSR request, then prove that this is an
# executable halt rather than merely OpenOCD's TARGET_HALTED bookkeeping.
# The tiny Thumb fixture writes a sentinel in SRAM and stops on BKPT.
proc bg22_require_sram_execution {} {
	targets efm32.cpu
	mww 0xe000edf0 0xa05f0003
	sleep 10
	poll
	# Zephyr may leave its MPU enabled with SRAM execute-never regions.  The
	# flash helper owns the halted core context, so disable the selected-domain
	# MPU before proving or running arbitrary SRAM code.
	mww 0xe000ed94 0

	set code 0x200007d0
	set marker 0x200007f0
	mww $marker 0
	# cpsid i; ldr r0, [pc, #12]; ldr r1, [pc, #12]; str r1, [r0];
	# bkpt #0.  Force a valid Thumb xPSR because the suspect halt state can
	# expose an all-zero cached register file.
	mww $code       0x4803b672
	mww [expr {$code + 4}] 0x60014903
	mww [expr {$code + 8}] 0xbf00be00
	mww [expr {$code + 12}] 0xbf00bf00
	mww [expr {$code + 16}] $marker
	mww [expr {$code + 20}] 0x51a7c0de
	reg xpsr 0x01000000
	resume $code
	# The onboard J-Link needs more than one second to observe the halt when
	# reconnecting from the BG22's low-power/debug state.
	wait_halt 5000
	set observed [read_memory $marker 32 1]
	if {$observed != 0x51a7c0de} {
		error [format "SRAM execution probe failed: marker is %s" $observed]
	}
}

proc bg22_preflight {} {
	bg22_require_sram_execution
	echo "BG22 SRAM execution preflight passed"
}

proc bg22_fast_flash {image run_after} {
	bg22_require_sram_execution
	flash erase_sector efm32.flash 0 last
	# Erasing vectors can change the observable core/debug state on this part.
	# Never start OpenOCD's asynchronous loader until execution is reproven.
	bg22_require_sram_execution
	# Hardware fault-injection hook for validating the recovery guarantee.  It
	# is deliberately after the blank-flash execution proof and inert unless
	# explicitly exported by the test invocation.
	if {[info exists ::env(OWO_BG22_TEST_FAIL_AFTER_ERASE)] &&
	    $::env(OWO_BG22_TEST_FAIL_AFTER_ERASE) == 1} {
		error "injected failure after erase"
	}
	flash write_image $image
	verify_image $image
	echo "BG22 fast erase/write/verify passed"
	if {$run_after} {
		catch {reset run}
	}
}

# TODO(upstream-openocd): this proc is a project-local workaround living
# downstream of OpenOCD, not a fix to OpenOCD itself. The generic
# `reset halt`/`reset run` codepath (target/cortex_m.c) has no visibility
# into Silicon Labs' proprietary DCI "Secure debug" status (see
# target/silabs/series2.cfg's silabs_s2_dci_read_se_status, which talks to a
# vendor-specific AP the generic reset path never reads) and so cannot know
# *why* its halt-after-reset request goes unanswered -- it can only time
# out. Candidates for a real fix upstream, in rough order of how much of
# OpenOCD's own behavior they'd improve:
#   1. Have `silabs/series2.cfg` read the DCI secure-debug-lock status once
#      at `init`/examine time and, if Secure debug is disabled, emit an
#      explicit warning (e.g. "Secure debug disabled: reset halt/run cannot
#      halt in the Secure state and may appear to hang") instead of letting
#      OpenOCD's generic polling loop time out with no explanation.
#   2. Teach the Silicon Labs series2 target a `reset_config` variant (or a
#      dedicated `silabs_s2_reset_to_breakpoint`-style command) that
#      performs exactly what `bg22_reset_to_breakpoint` does below --
#      pre-arm the FPB, pulse SYSRESETREQ, poll through the expected
#      transient AP-unreadable window -- as a supported alternative to
#      `reset halt` whenever Secure debug is off, rather than leaving every
#      downstream project to rediscover this.
# Neither has been attempted upstream; this file only needed the proc below
# to unblock hardware bring-up here.
#
# --- Reliable "catch a hardware breakpoint across a real reset" ---------
#
# GOAL: arm a hardware breakpoint on a chosen address and have it fire
# deterministically the first time the firmware's execution reaches that
# address after a *real* reset -- no race, no manual retry, independent of
# whatever the core was doing beforehand (freshly flashed, mid-application,
# already crashed, previously halted by another one of these helpers, ...).
#
# WHY NOT OpenOCD's `reset halt` / `reset run`:
# This target's series2.cfg sets `cortex_m reset_config sysresetreq` (no
# SRST is wired from the J-Link OB), so any `reset ...` variant issues
# AIRCR.SYSRESETREQ and then tries to use DEMCR.VC_CORERESET (vector catch)
# to stop the core the instant it fetches the reset vector. Confirmed on
# this hardware: `reset halt` reliably prints "[efm32.cpu] external reset
# detected" (a real reset did happen) and then either hangs or times out
# with "timed out while waiting for target halted" -- the core is never
# actually caught, it is simply left running.
#
# ROOT CAUSE (confirmed on this board, not just inferred):
#   `silabs_s2_dci_read_se_status` on this chip reports "Debug lock (config):
#   Disabled" and "Debug lock (hw status): Disabled" -- general SWD debug
#   is fully open -- but reports "Secure debug: Disabled". This EFR32BG22 is
#   an Armv8-M TrustZone part, and every reset (hardware or
#   AIRCR.SYSRESETREQ) starts execution in the Secure state, at the Secure
#   reset vector. With Secure debug disabled, the debug block is not
#   permitted to actually halt the core -- by any mechanism (DHCSR.C_HALT,
#   DEMCR vector catch, or a hardware breakpoint match) -- while execution
#   is in the Secure state; the halt request is simply not honored until
#   the core later branches into Non-secure code. This was reproduced
#   directly: deliberately forcing the core's PC to the real Secure reset
#   handler (via raw `reg pc`/`reg sp`, bypassing `reset` entirely) let it
#   run -- confirming halting was refused there too, not merely slow --
#   and it then double-faulted into lockup once it hit inconsistent
#   peripheral/exception state that a real silicon reset would have
#   initialized correctly (CONTROL, VTOR, active-exception tracking, etc.,
#   none of which a manual register poke reproduces). Manually synthesizing
#   a "reset state" by hand is therefore both impossible to observe (you
#   cannot verify a halt that the hardware refuses to grant) and unsafe to
#   attempt (confirmed hardware lockup) -- do not resurrect that approach.
#
# THE FIX THAT ACTUALLY WORKS:
#   A hardware breakpoint comparator (FPB), once armed with `bp`, survives
#   AIRCR.SYSRESETREQ intact -- confirmed repeatedly on hardware -- even
#   though DHCSR/DEMCR debug-halt *requests* do not take effect until
#   Non-secure code runs. So: arm the breakpoint(s) you actually care about
#   *before* touching AIRCR, then pulse a real SYSRESETREQ and just wait.
#   The core boots the real Secure bootloader/TrustZone handoff exactly as
#   silicon designed it to (nothing about that path is touched or
#   bypassed), and the moment it reaches your breakpoint address in
#   Non-secure code, the comparator fires and the halt is finally honored.
#   This is not a literal "halt at the reset vector" (that is architecturally
#   unreachable on this part given Secure debug is disabled) but it gives
#   the same guarantee the caller actually needs: the breakpoint is live
#   before any Non-secure application code executes, and it cannot be
#   missed by a timing race, because it is a hardware address comparator,
#   not a polling loop.
#
#   Verified 5/5 on real hardware for two different addresses, each time
#   starting from the halted state the previous run left behind:
#     - main()     (0x0001a9a6 in build-stage3/zephyr/zephyr.elf)
#     - z_cstart() (0x00016d50 in the same image, reached well before main)
#   Right after the reset the AP/DP briefly can't be read ("external reset
#   detected", and a `read_memory`/`poll` immediately after the `mww` can
#   fail) while the debug block resyncs; this proc absorbs that by polling
#   in a retry loop rather than a single `wait_halt`.
#
# Precondition: call bg22_require_sram_execution first (proven, responsive
# halt), then arm every breakpoint you want with plain `bp <addr> 2 hw`
# *before* calling this proc. This proc only performs the reset and waits;
# it does not arm anything itself, so it composes with any number of
# breakpoints.
#
# Usage, e.g. to reliably catch main() no matter what the core was doing:
#   -c 'init
#        bg22_require_sram_execution
#        bp 0x1a9a6 2 hw
#        bg22_reset_to_breakpoint
#        reg pc'
proc bg22_reset_to_breakpoint {{timeout_ms 8000}} {
	targets efm32.cpu
	# AIRCR: VECTKEY (0x05fa) in bits [31:16], SYSRESETREQ is bit 2.
	mww 0xe000ed0c 0x05fa0004
	set elapsed 0
	set step_ms 50
	while {$elapsed < $timeout_ms} {
		sleep $step_ms
		incr elapsed $step_ms
		# The AP is briefly unreadable right after SYSRESETREQ while the
		# debug block resyncs with the reset core; that is expected, not a
		# failure, so swallow errors from `poll`/`read_memory` and keep
		# retrying rather than aborting on the first one.
		if {[catch {poll} _]} {
			continue
		}
		if {[catch {set dhcsr [read_memory 0xe000edf0 32 1]} _]} {
			continue
		}
		# DHCSR bit1 C_HALT and bit17 S_HALT both set means the core is
		# genuinely halted (by our pre-armed breakpoint, since nothing else
		# requested a halt), not just that OpenOCD's cache says so.
		if {($dhcsr & 0x00020002) == 0x00020002} {
			set pcv [capture {reg pc}]
			echo [format "BG22 reset-to-breakpoint caught: %s (after %dms)" $pcv $elapsed]
			return
		}
	}
	error [format "bg22_reset_to_breakpoint: no breakpoint hit within %dms of SYSRESETREQ" $timeout_ms]
}

proc bg22_slow_recover {image run_after} {
	targets efm32.cpu
	mww 0xe000edf0 0xa05f0003
	sleep 10
	poll
	flash write_image $image
	verify_image $image
	echo "BG22 slow recovery write/verify passed"
	if {$run_after} {
		catch {reset run}
	}
}
