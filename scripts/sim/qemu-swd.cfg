# OpenOCD adapter for the simulator without USB: QEMU's swd-remote-bitbang
# probe (docs/debug-port-model.md).  Use it in place of
#   -f interface/jlink.cfg -c 'adapter serial ...' -c 'transport select swd'
# QEMU side:
#   -chardev socket,id=swd,host=localhost,port=44242,server=on,wait=off
#   -device swd-remote-bitbang,chardev=swd
# OWO_QEMU_SWD_PORT overrides the port.

adapter driver remote_bitbang
remote_bitbang host localhost
if {[info exists ::env(OWO_QEMU_SWD_PORT)]} {
	remote_bitbang port $::env(OWO_QEMU_SWD_PORT)
} else {
	remote_bitbang port 44242
}
transport select swd
