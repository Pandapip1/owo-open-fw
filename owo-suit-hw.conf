# Applied by -DOWO_HW=ON. Drives the real output stage. UNVALIDATED on hardware.
CONFIG_OWO_STIM_UNVALIDATED_HARDWARE=y
CONFIG_GPIO=y
CONFIG_I2C=y
# Expander transfers end within this, also with the bus dead (SDA held low, no acknowledge). With
# the bus dead a pump pass makes at most 22: 6 per faulted pulse (supplies on, off again after the
# failure, off on the fault, 2 each) for up to CONFIG_OWO_STIM_FAULT_LOCKOUT = 3 pulses, the
# stop-input read, the idle safe-off (2) and one from the system work queue waited out first.
# 22 x 1 ms stays inside the 22.4 ms between the longest legitimate feed interval and the
# watchdog warning (docs/watchdog.md). The longest transfer, 3 bytes, is 29 bit times (0.29 ms)
# at 100 kHz.
CONFIG_I2C_SILABS_TIMEOUT=1
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_PINCTRL=y
CONFIG_REGULATOR=y
# The output stage reads two IADC channels, the sense input (channel 0) and the battery divider
# (channel 1) in boards/*_hw.overlay; modules/owo-stim/shim/owo_shim.c asserts they fit. The
# driver's other 14 channel entries would be 112 B of RAM.
CONFIG_ADC_SILABS_IADC_CHANNELS=2
