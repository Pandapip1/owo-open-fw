# Applied by -DOWO_HW=ON. Drives the real output stage. UNVALIDATED on hardware.
CONFIG_OWO_STIM_UNVALIDATED_HARDWARE=y
CONFIG_GPIO=y
CONFIG_I2C=y
CONFIG_SPI=y
CONFIG_PWM=y
CONFIG_ADC=y
CONFIG_DAC=y
CONFIG_PINCTRL=y
CONFIG_REGULATOR=y
# The output stage reads two IADC channels, the sense input (channel 0) and the battery divider
# (channel 1) in boards/*_hw.overlay; modules/owo-stim/shim/owo_shim.c asserts they fit. The
# driver's other 14 channel entries would be 112 B of RAM.
CONFIG_ADC_SILABS_IADC_CHANNELS=2
