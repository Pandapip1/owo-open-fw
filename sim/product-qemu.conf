# The product image in the QEMU model (EXTRA_CONF_FILE on top of prj.conf, with or without
# -DOWO_HW=ON): deadlines and budgets from the model's measured times, and missed deadlines
# counted instead of stopping the radio, as the QEMU connection profiles do
# (tests/radio-port/prj-connection.conf; docs/radio-tables.md 7.79: the model runs the
# connection turnarounds past their spec-derived start-by). Never on hardware.
CONFIG_EFR32_RADIO_TIMING_QEMU=y
CONFIG_SCHED_DEADLINE_MISS_COUNT=y
# Run the real radio HAL paths, as tests/radio-port's QEMU profiles do: with the default stub
# the HAL asserts at the first data channel (EFR32_RADIO_AIR_TODO, hal/radio.c), so the
# product's first connection event stops it.
CONFIG_EFR32_RADIO_STUB_REGISTERS=n
