[workspace]
resolver = "2"
members = [
    "crates/owo-hal",
    "crates/owo-stim",
    "crates/owo-hbridge",
    "crates/owo-switch",
    "crates/ltc2634",
    "crates/zephyr-io",
    "crates/owo-suit",
]

[workspace.package]
edition = "2021"
license = "Apache-2.0 OR MIT"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
