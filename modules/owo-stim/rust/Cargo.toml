[package]
name = "owo-stim"
version = "0.1.0"
edition = "2021"
description = "Reusable stimulation-output driver + safety supervisor for the OWO suit hardware (EFR32xG22)"
license = "Apache-2.0 OR MIT"

[features]
default = []
# Real hardware backend (needs the Zephyr build environment for bindgen).
xg22 = ["dep:bindgen"]

[dependencies]

[build-dependencies]
bindgen = { version = "0.72.1", features = ["experimental"], optional = true }
