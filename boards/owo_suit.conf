# Silicon Labs OTA: the boot-mode request is Zephyr's retention API (boards/owo_product.dtsi).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y
# Link into the board's code partition (0x16000, behind the Gecko Bootloader and AppLoader)
CONFIG_USE_DT_CODE_PARTITION=y
