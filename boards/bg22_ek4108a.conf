# Silicon Labs OTA: the boot-mode request is Zephyr's retention API (boards/bg22_ek4108a.overlay).
CONFIG_RETAINED_MEM=y
CONFIG_RETENTION=y
CONFIG_RETENTION_BOOT_MODE=y
CONFIG_REBOOT=y
# Link into the code partition of the overlay (0x16000, behind the Gecko Bootloader)
CONFIG_USE_DT_CODE_PARTITION=y
