CONFIG_RUST=y
# The 32 KiB BG22 cannot afford a deferred logger thread beside the combined
# host/controller and safety supervisor. Native QEMU test apps retain their
# own trace transport; hardware faults use the watchdog/reset-safe-off path.
CONFIG_LOG=n
# Measured in build/ram-probe with the full peripheral/MITM/dynamic-GATT
# profile. Stack sentinels and initialized-stack watermarks remain enabled so
# hardware qualification can reject an insufficient budget. The retained map
# is checked with scripts/check-hardware-ram.sh, which holds a 1,760-byte
# reserve below the BG22's 32,760-byte usable RAM region.
CONFIG_MAIN_STACK_SIZE=2048
CONFIG_ISR_STACK_SIZE=1536
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_USAGE=y

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OWO0000000000"
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=n
CONFIG_BT_MAX_CONN=1
# One connection and the product's short control writes do not require the
# generic multi-connection queue depths. These are Zephyr's legal minima:
# L2CAP itself requires two TX buffers and HCI requires two event buffers.
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_ACL_TX_COUNT=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_L2CAP_TX_FRAG_COUNT=1
CONFIG_BT_ATT_TX_COUNT=1
# The GATT table is built at run time from Rust
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="OWO"
CONFIG_BT_BAS=y

# Tickless: no periodic kernel tick while idle
CONFIG_TICKLESS_KERNEL=y

# Keep Silicon Labs' sleeptimer system clock and power manager (EM2/EM3 sleep).
# This needs the pinned zephyr-lang-rust submodule: stock zephyr-lang-rust
# disables Rust whenever TIMER_READS_ITS_FREQUENCY_AT_RUNTIME is set, which the sleeptimer
# driver selects.
CONFIG_PM=y

# Hardware watchdog (boards/*.overlay enables wdog0; fed from the pump, src/wdt.rs)
CONFIG_WATCHDOG=y

# Output stage. Off = log-only dry run. See modules/owo-stim/Kconfig.
CONFIG_OWO_STIM=y
# CONFIG_OWO_STIM_UNVALIDATED_HARDWARE is NOT set: no output until you opt in (bench only).
