CONFIG_RUST=y
CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=4096

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OWO0000000000"
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=n
CONFIG_BT_MAX_CONN=1
# The GATT table is built at run time from Rust
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="OWO"
CONFIG_BT_BAS=y

# Tickless: no periodic kernel tick while idle
CONFIG_TICKLESS_KERNEL=y

# zephyr-lang-rust refuses system clocks whose frequency is read at run time
# (RUST_SUPPORTED needs !TIMER_READS_ITS_FREQUENCY_AT_RUNTIME), and Zephyr's Silicon
# Labs sleeptimer driver selects exactly that. So Rust builds must use the Cortex-M
# SysTick instead. COST: Silicon Labs' power manager (EM2/EM3 sleep) needs the
# sleeptimer (it fails to link without it), so CONFIG_PM stays off and the core idles
# in WFI only. This works against the idle-power goal; see README.md.
CONFIG_SILABS_SLEEPTIMER_TIMER=n
CONFIG_CORTEX_M_SYSTICK=y
CONFIG_PM=n
