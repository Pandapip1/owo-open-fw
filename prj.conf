CONFIG_RUST=y
# The 32 KiB BG22 cannot afford a deferred logger thread beside the combined
# host/controller and safety supervisor. Native QEMU test apps retain their
# own trace transport; hardware faults use the watchdog/reset-safe-off path.
CONFIG_LOG=n
# Measured in build/ram-probe with the full peripheral/MITM/dynamic-GATT
# profile. Stack sentinels and initialized-stack watermarks remain enabled so
# hardware qualification can reject an insufficient budget. The retained map
# is checked with scripts/check-hardware-ram.sh, which holds a 1,760-byte
# reserve below the BG22's 32,760-byte usable RAM region.
CONFIG_MAIN_STACK_SIZE=2048
# Main: bt_enable and the output supervisor (FP: 108-byte frame); 1420 B peak in the QEMU
# product runs (7.86). The controller runs in threads (modules/efr32-radio/hal/ll_threads.c),
# not on the interrupt stack; it peaked at 536 B (QEMU product runs, the watchdog's warning
# interrupt included; 540 B on silicon). Neither is cut: their worst-case nesting and paths
# are wider than the runs.
CONFIG_ISR_STACK_SIZE=1024
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_STACK_USAGE=y
# Thread stacks: each at least its measured worst-case high-water mark (CONFIG_INIT_STACKS) plus
# one exception frame, rounded up to the 8-byte stack alignment (docs/radio-tables.md 7.86).
# Frame: only the main thread executes FP instructions (the IADC driver's start_read, reached
# only from the output supervisor), so an interrupt pushes the 104-byte extended frame (+4 of
# alignment) only there; every other thread keeps CONTROL.FPCA clear and takes the 32-byte basic
# frame (+4). Peaks: QEMU product runs (owo_suit -DOWO_HW=ON, sim/product-qemu.conf, suit board:
# LE Secure Connections pairing, 870 s of encrypted GATT and stimulation commanded over the link;
# 23 stimulation fault scenarios) and silicon held encrypted connections of the radio-port
# pairing profile with the laptop (7.84, 7.86), the largest of all sources.
#
# The long work queue runs only the host's P-256 key generation and DH key (GATT caching is
# off); its deepest point is p256-m's field multiply in both images: 732 B in the product (QEMU,
# every pairing), 968 B in the radio-port image on silicon, whose LTO inlining differs. 968 + 36.
CONFIG_BT_LONG_WQ_STACK_SIZE=1008
# Link-layer threads, silicon peaks of held encrypted connections (7.84; the QEMU product run's
# are lower: ULL 532, LLL 656, completion 604). ULL 648 + 36 = 684, LLL 748 + 36; the
# completion job's 768 covers 664 + 36.
CONFIG_EFR32_RADIO_ULL_STACK_SIZE=688
CONFIG_EFR32_RADIO_LLL_STACK_SIZE=784
# Radio launch jobs: TX 440 B (silicon, encrypted, 7.86; 7.84: 428) + 36, RX 372 B (QEMU
# product; silicon 368) + 36.
CONFIG_EFR32_RADIO_TX_LAUNCH_STACK_SIZE=480
CONFIG_EFR32_RADIO_RX_LAUNCH_STACK_SIZE=408
# Word-wise memset/memcpy (+96 B flash). The external output parts keep their state across an MCU
# reset until the first init level re-asserts the safe levels (owo_suit_early_safe_off); the
# byte-wise routines made the C runtime's .bss/.data initialisation before that take 6.2 ms in
# the QEMU model (4.44 ms .bss, 1.79 ms .data), the word-wise ones 1.7 ms: with the stock
# bootloader's 2.6 ms, the boost supply is off 4.65 ms after a reset instead of 9.63 ms
# (docs/stim-simulation.md).
CONFIG_MINIMAL_LIBC_OPTIMIZE_STRING_FOR_SIZE=n

CONFIG_BT=y
CONFIG_BT_PERIPHERAL=y
CONFIG_BT_DEVICE_NAME="OWO0000000000"
CONFIG_BT_SMP=y
CONFIG_BT_SMP_ENFORCE_MITM=y
CONFIG_BT_APP_PASSKEY=y
CONFIG_BT_BONDABLE=y
CONFIG_BT_SETTINGS=n
CONFIG_BT_MAX_CONN=1
# One connection and the product's short control writes do not require the
# generic multi-connection queue depths. These are Zephyr's legal minima:
# L2CAP itself requires two TX buffers and HCI requires two event buffers.
CONFIG_BT_BUF_EVT_RX_COUNT=2
CONFIG_BT_BUF_EVT_DISCARDABLE_COUNT=1
CONFIG_BT_BUF_ACL_TX_COUNT=1
CONFIG_BT_L2CAP_TX_BUF_COUNT=2
CONFIG_BT_L2CAP_TX_FRAG_COUNT=1
CONFIG_BT_ATT_TX_COUNT=1
# The GATT table is built at run time from Rust
CONFIG_BT_GATT_DYNAMIC_DB=y
CONFIG_BT_DIS=y
CONFIG_BT_DIS_MANUF_NAME=y
CONFIG_BT_DIS_MANUF_NAME_STR="OWO"
CONFIG_BT_BAS=y

# Tickless: no periodic kernel tick while idle
CONFIG_TICKLESS_KERNEL=y

# System time, kernel timeouts and radio wake-ups come from the scheduler clock: BURTC
# across deep sleep, TIMER0 (EM01GRPACLK) while the CPU runs (boards/*.overlay). Its
# 64-bit cycle count also backs the timing API used for output-stage timestamps.
CONFIG_CLOCK_EVENT_SYSTEM_TIMER=y
CONFIG_SILABS_BURTC_CLOCK_EVENT=y
CONFIG_COUNTER_SILABS_BURTC=n
CONFIG_COUNTER=y
CONFIG_COUNTER_SILABS_TIMER_CLOCK_EVENT=y
# The RTCC Counter driver is unused and does not build for this SoC.
CONFIG_COUNTER_GECKO_STIMER=n
CONFIG_TIMING_SYS_CLOCK=y
# Power manager (EM1/EM2 sleep); the scheduler clock locks out EM2+ only while it
# needs TIMER0 for a pending deadline.
CONFIG_PM=y

# Hardware watchdog: WDOG0 owned by src/watchdog.c (CONFIG_OWO_WATCHDOG, on by default), fed
# by the pump (src/wdt.rs); Zephyr's watchdog driver is not used (docs/watchdog.md).

# Output stage. Off = log-only dry run. See modules/owo-stim/Kconfig.
CONFIG_OWO_STIM=y
# CONFIG_OWO_STIM_UNVALIDATED_HARDWARE is NOT set: no output until you opt in (bench only).
# The lower link layer runs in meta-IRQ threads, not interrupts (modules/efr32-radio/hal/ll_threads.c):
# the LLL and radio jobs at the first priority, the ULL worker at the second.
CONFIG_NUM_METAIRQ_PRIORITIES=2
# BT_CTLR_ZLI is only settable with the controller's advanced options visible.
CONFIG_BT_CTLR_ADVANCED_FEATURES=y
CONFIG_BT_CTLR_ZLI=n
# Drive the radio registers (the module default is a register-free stub whose HAL asserts at the
# first data channel, EFR32_RADIO_AIR_TODO in hal/radio.c, so a product could advertise but never
# hold a connection). Hardware and QEMU builds alike; QEMU-only timing stays in
# sim/product-qemu.conf.
CONFIG_EFR32_RADIO_STUB_REGISTERS=n

# Flash/RAM budget (measured 2026-10-31 against the full default build, 192.7 KB flash;
# together 143.2 KB). Link-time optimisation: -25.9 KB.
CONFIG_LTO=y
CONFIG_ISR_TABLES_LOCAL_DECLARATION=y
# No console on the suit: printk, the boot banner and the complete printf engine go
# (-17.4 KB). Missed-deadline and safe-shutdown reports are then not printed.
CONFIG_PRINTK=n
CONFIG_BOOT_BANNER=n
CONFIG_CBPRINTF_NANO=y
# One connection and no stored bonds: no controller address resolution or filter accept
# list is needed (-5.4 KB).
CONFIG_BT_CTLR_PRIVACY=n
CONFIG_BT_CTLR_FILTER_ACCEPT_LIST=n
# A fault resets the unit; the register dump has nowhere to go (-2.3 KB).
CONFIG_EXCEPTION_DEBUG=n
CONFIG_FAULT_DUMP=0
# Clients rediscover the small GATT table on each connection (-2.0 KB).
CONFIG_BT_GATT_CACHING=n
# No vendor-specific HCI commands are used (-0.8 KB).
CONFIG_BT_HCI_VS=n
# AES runs on the RADIOAES accelerator (modules/efr32-radio/crypto, docs/crypto.md): the
# controller's session-key ECB and link-layer CCM call it directly, the host's AES-ECB
# (bt_encrypt_le) and AES-CMAC (SMP f4/f5/f6/g2/h6) reach it through PSA Crypto's driver
# dispatch. No software AES is built and nothing allocates: no mbedtls heap, libc arena 0.
# P-256 stays in software (p256-m): the accelerator's public-key engine is not publicly
# documented.
#
# PSA key slots (104 B each). The PSA users left import or generate one key, use it and destroy
# it before returning, never nesting: host ECC (generate_pub_key, generate_dh_key,
# bt_pub_key_is_valid) on the BT long work queue and SMP's AES-CMAC (bt_crypto_psa.c) and
# bt_encrypt_le on the BT RX thread or the long work queue (f5/f6 in the DHKey callback). So at
# most one key per thread, two threads: two slots. Measured in QEMU with a slot counter in
# tf-psa-crypto (2026-10-31, owo_suit with sim/product-qemu.conf, bt_enable, LE Secure
# Connections passkey pairing and 150 s of encrypted GATT): one live slot at most. Exhaustion
# fails the import, it does not corrupt memory: a failed pairing (-208 B against four slots).
CONFIG_MBEDTLS_PSA_KEY_SLOT_COUNT=2
